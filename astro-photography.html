<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Astro Photography - Whitegate Observatory</title>
    <link rel="stylesheet" href="assets/css/dashboard.css" />
    <style>
      .top-menu {
        background: #1a1a1a;
        padding: 0.85rem 2rem;
        border-bottom: 2px solid #333;
      }
      .top-menu nav {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        gap: 2rem;
        align-items: center;
      }
      .top-menu a {
        color: #fff;
        text-decoration: none;
        font-weight: 500;
        padding: 0.5rem 1rem;
        border-radius: 4px;
        transition: background 0.2s;
      }
      .top-menu a:hover {
        background: #333;
      }
      .top-menu .logo {
        font-size: 1.2rem;
        font-weight: 700;
        color: #4a9eff;
      }
      .content {
        max-width: 1200px;
        margin: 2rem auto;
        padding: 0 2rem;
      }
      .content h1 {
        color: #4a9eff;
        margin-bottom: 1rem;
      }
      .content p {
        line-height: 1.6;
        margin-bottom: 1rem;
      }
      .outlook-frame {
        width: 100%;
        min-height: 520px;
        border: none;
        border-radius: 8px;
        overflow: hidden;
        display: block;
        margin-top: 1.5rem;
      }
      .outlook-data {
        margin-top: 1.5rem;
      }
      .outlook-card {
        background: #0f172a;
        color: #e2e8f0;
        border: 1px solid #334155;
        border-radius: 10px;
        padding: 1rem;
      }
      .outlook-title {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
        align-items: baseline;
        margin-bottom: 0.75rem;
      }
      .outlook-title h2 {
        margin: 0;
        font-size: 1.1rem;
        color: #93c5fd;
      }
      .outlook-meta {
        font-size: 0.9rem;
        color: #cbd5e1;
      }
      .outlook-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.92rem;
      }
      .outlook-table th,
      .outlook-table td {
        border-top: 1px solid #334155;
        padding: 0.55rem 0.45rem;
        text-align: left;
        vertical-align: top;
      }
      .outlook-table th {
        color: #bfdbfe;
        font-weight: 600;
      }
      .score-pill {
        display: inline-block;
        border-radius: 999px;
        padding: 0.2rem 0.55rem;
        font-weight: 700;
        font-size: 0.82rem;
      }
      .score-best {
        background: #14532d;
        color: #bbf7d0;
      }
      .score-good {
        background: #1e3a8a;
        color: #bfdbfe;
      }
      .score-fair {
        background: #78350f;
        color: #fde68a;
      }
      .score-poor {
        background: #7f1d1d;
        color: #fecaca;
      }
      .outlook-error {
        margin-top: 1.5rem;
        padding: 1rem;
        border: 1px solid #444;
        border-radius: 8px;
        background: #141414;
        color: #ddd;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="top-menu">
      <nav>
        <a href="index.html" class="logo">Whitegate Observatory</a>
        <a href="marine.html">Marine</a>
        <a href="radio.html">Radio</a>
        <a href="radio-astronomy.html">Radio Astronomy</a>
        <a href="astro-photography.html">Astro Photography</a>
        <a href="tinygs.html">TinyGS</a>
      </nav>
    </div>
    <div class="content">
      <h1>Astro Photography</h1>
      <p>Astrophotography outlook for Whitegate Observatory — nightly scoring based on cloud cover, sky darkness (SQM), dew spread, wind, precipitation, and moon brightness.</p>
      <div id="astroOutlookData" class="outlook-data"></div>
      <iframe
        id="astroOutlookFrame"
        class="outlook-frame"
        title="Astrophotography Outlook"
        scrolling="no"
      ></iframe>
      <div id="astroOutlookError" class="outlook-error"></div>
    </div>

    <script>
      (function () {
        const dataRoot = document.getElementById('astroOutlookData');
        const frame = document.getElementById('astroOutlookFrame');
        const errorBox = document.getElementById('astroOutlookError');
        const htmlSources = ['astro/astro.html', 'dist/astro/astro.html'];
        const jsonSources = ['astro/astro.json', 'dist/astro/astro.json'];
        let sourceIndex = 0;

        function scoreClass(score) {
          if (score >= 80) return 'score-best';
          if (score >= 60) return 'score-good';
          if (score >= 40) return 'score-fair';
          return 'score-poor';
        }

        function escapeHtml(value) {
          return String(value)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
        }

        function renderFromJson(payload, sourcePath) {
          const nights = Array.isArray(payload.nights) ? payload.nights : [];
          if (!nights.length) return false;

          const rows = nights.map(function (n) {
            const score = Number(n.score || 0);
            const cls = scoreClass(score);
            return '<tr>' +
              '<td>' + escapeHtml(n.label || 'Night') + '<br><small>' + escapeHtml((n.start_local || '') + ' -> ' + (n.end_local || '')) + '</small></td>' +
              '<td><span class="score-pill ' + cls + '">' + escapeHtml(score.toString()) + '</span></td>' +
              '<td>' + escapeHtml(n.clouds || '—') + '</td>' +
              '<td>' + escapeHtml(n.dewspread || '—') + '</td>' +
              '<td>' + escapeHtml(n.precip || '—') + '</td>' +
              '<td>' + escapeHtml(n.worst || '—') + '</td>' +
              '<td>' + escapeHtml(n.best2h || '—') + '</td>' +
              '</tr>';
          }).join('');

          dataRoot.innerHTML =
            '<div class="outlook-card">' +
              '<div class="outlook-title">' +
                '<h2>Astrophotography Outlook</h2>' +
                '<div class="outlook-meta">Updated: ' + escapeHtml(payload.generated_at_local || payload.generated_at || 'Unknown') + ' | Source: ' + escapeHtml(sourcePath) + '</div>' +
              '</div>' +
              '<table class="outlook-table">' +
                '<thead><tr><th>Night</th><th>Score</th><th>Cloud</th><th>Dew Spread</th><th>Precip</th><th>Worst Metric</th><th>Best 2h Window</th></tr></thead>' +
                '<tbody>' + rows + '</tbody>' +
              '</table>' +
            '</div>';

          frame.style.display = 'none';
          errorBox.style.display = 'none';
          return true;
        }

        async function tryJson(index) {
          if (index >= jsonSources.length) return false;
          const src = jsonSources[index];
          try {
            const response = await fetch(src, { cache: 'no-store' });
            if (!response.ok) return tryJson(index + 1);
            const payload = await response.json();
            if (renderFromJson(payload, src)) return true;
            return tryJson(index + 1);
          } catch (err) {
            return tryJson(index + 1);
          }
        }

        function setFrameHeight() {
          try {
            const doc = frame.contentWindow && frame.contentWindow.document;
            if (!doc || !doc.documentElement) return;
            frame.style.height = (doc.documentElement.scrollHeight + 32) + 'px';
          } catch (err) {
            // Ignore cross-origin or transient access errors.
          }
        }

        function looksLikeMissingPage() {
          try {
            const doc = frame.contentWindow && frame.contentWindow.document;
            if (!doc) return false;
            const title = (doc.title || '').toLowerCase();
            const text = (doc.body && doc.body.textContent ? doc.body.textContent : '').toLowerCase();
            return title.includes('404') || text.includes('not found');
          } catch (err) {
            return false;
          }
        }

        function trySource(index) {
          sourceIndex = index;
          if (sourceIndex >= sources.length) {
            frame.style.display = 'none';
            errorBox.style.display = 'block';
            errorBox.textContent = 'Astrophotography outlook was not found. Expected existing build files: astro/astro.json or astro/astro.html (or dist/astro variants).';
            return;
          }
          frame.src = htmlSources[sourceIndex];
        }

        frame.addEventListener('load', function () {
          if (looksLikeMissingPage()) {
            trySource(sourceIndex + 1);
            return;
          }
          setFrameHeight();
        });

        frame.addEventListener('error', function () {
          trySource(sourceIndex + 1);
        });

        window.addEventListener('resize', setFrameHeight);
        tryJson(0).then(function (loaded) {
          if (!loaded) {
            trySource(0);
          }
        });
      })();
    </script>
  </body>
</html>
